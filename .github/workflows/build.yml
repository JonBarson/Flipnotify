name: Build FlipNotify
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: cd android && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlipNotify-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk -t "Latest build" -n "Automated APK build" \
            || gh release upload latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
  flipper:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip ufbt
      - run: cd flipper && ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: FlipNotify-flipper
          path: flipper/dist/flipnotify.fap
